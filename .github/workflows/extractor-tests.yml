name: Extractor tests

on:
  workflow_dispatch:
  schedule:
    # Daily, to notice when YouTube changes break stream extraction.
    - cron: '0 6 * * *'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: "temurin"
          cache: 'gradle'

      # The real network tests extract real YouTube videos and request every stream they
      # return, including when the decoder cannot decode signatures or n parameters.
      - name: Run extractor tests against real YouTube videos
        run: |
          cd PipePipeExtractor
          ./gradlew :extractor:test -Dyoutube.realNetwork=true --stacktrace

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: extractor-test-reports
          path: PipePipeExtractor/extractor/build/reports/tests/test
          if-no-files-found: ignore
